name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 既定は読み取りだけ。書き込みが要る deploy ジョブだけ下で個別に足す
permissions:
  contents: read

jobs:
  # 1. 公開するファイルを _site にまとめてアップロードする
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html inc.sf2 Inc_SoundFont.xml README.md _site/
          cp -r sound _site/sound
          cp -r niji otenkiame _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_site

  # 2. ビルド完了後に Pages へデプロイする
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # デプロイに必須
      id-token: write # OIDC認証に必須
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
